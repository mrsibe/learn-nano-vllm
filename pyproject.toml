[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-vllm"
version = "0.2.0"
authors = [{ name = "Xingkai Yu" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "a lightweight vLLM implementation built from scratch"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.8.0",
    "triton==3.4.0",
    "transformers>=4.55.0,<5",
    "flash-attn==2.8.3",
    "numpy",
    "safetensors",
    "tqdm",
    "xxhash",
]

[dependency-groups]
dev = ["ruff>=0.17.1,<0.18"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# FlashAttention's wheel must match Python, PyTorch, CUDA and the C++ ABI.
# This uv environment targets Linux x86_64 with an NVIDIA Ampere/Ada/Hopper GPU.
[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu12torch2.8cxx11abiTRUE-cp312-cp312-linux_x86_64.whl" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.urls]
Homepage="https://github.com/mrsibe/learn-nano-vllm"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanovllm*"]
